# /usr/local/etc/vpn-guard/unsafe.pf.conf
# PF anchor rules loaded when network is "unsafe" (no VPN or on hotspot).
# Loaded as: pfctl -a com.apple/vpn-guard -f /usr/local/etc/vpn-guard/unsafe.pf.conf
# (Nested under com.apple/ so the main ruleset's "com.apple/*" wildcard evaluates
#  it; a top-level "vpn-guard" anchor loads but is never evaluated.)
#
# Strategy:
#   1. Block the configured transfer-client listen port (56378) on every
#      interface, both IPv4 and IPv6, both TCP and UDP.
#   2. Block the common legacy peer-transfer range 6881-6889 as defense in depth.
#   3. Block UDP announce/scrape port 6969.
#
# This is process-agnostic: even if the client re-binds, the listen port itself
# is blocked. Combined with the user-side script that pauses the client via Web
# API, this is belt-and-suspenders.

# Transfer-client peer listen port.
block drop quick proto { tcp udp } from any to any port 56378
block drop quick inet6 proto { tcp udp } from any to any port 56378

# Legacy peer-transfer port range.
block drop quick proto { tcp udp } from any to any port 6881 >< 6890
block drop quick inet6 proto { tcp udp } from any to any port 6881 >< 6890

# UDP announce/scrape.
block drop quick proto udp from any to any port 6969
block drop quick inet6 proto udp from any to any port 6969
